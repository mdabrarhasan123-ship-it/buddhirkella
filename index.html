/** Work through one campaign, showing progress. Safe to re-run: the database prevents double sends. */
async function runCampaign(campaignId, title = 'ইমেইল পাঠানো হচ্ছে') {
  const bar = h('i'), line = h('p', { class: 'modal__text', role: 'status', text: 'প্রস্তুতি চলছে…' }), foot = h('div', { class: 'modal__actions' });
  const m = openModal([h('h2', { class: 'modal__title', text: title }), h('div', { class: 'progressbar', role: 'progressbar', 'aria-label': 'পাঠানোর অগ্রগতি' }, bar), line, foot], { dismissible: false, label: title });
  const done = (txt, kind = 'ok') => { line.textContent = txt; line.style.color = kind === 'error' ? 'var(--oxblood)' : ''; foot.replaceChildren(h('button', { class: 'btn', type: 'button', onClick: () => m.close() }, 'বন্ধ করুন')); };
  try {
    const t0 = Date.now(); let c = await getCampaign(campaignId);
    for (let i = 0; i < 40 && ['queued', 'sending'].includes(c.status) && Date.now() - t0 < 240000; i++) {
      await callFn({ action: 'process', campaign_id: campaignId });
      c = await getCampaign(campaignId);
      const finished = c.sent_count + c.failed_count + c.skipped_count;
      bar.style.width = `${c.recipient_count ? Math.round((finished / c.recipient_count) * 100) : 5}%`;
      line.textContent = `${bnNum(c.recipient_count)} জনের মধ্যে ${bnNum(c.sent_count)} জনকে পাঠানো হয়েছে${c.failed_count ? ` · ${bnNum(c.failed_count)}টি ব্যর্থ` : ''}…`;
      if (['queued', 'sending'].includes(c.status)) await sleep(4000);
    }
    bar.style.width = '100%';
    if (c.status === 'sent') done(`সম্পন্ন — ${bnNum(c.sent_count)}টি ইমেইল পাঠানো হয়েছে${c.skipped_count ? `, ${bnNum(c.skipped_count)}টি বাদ গেছে (ইতিমধ্যে আনসাবস্ক্রাইব করেছেন)` : ''}।`);
    else if (c.status === 'partial' || c.status === 'failed') done(`${bnNum(c.sent_count)}টি গেছে, ${bnNum(c.failed_count)}টি ব্যর্থ। ${c.last_error || ''} “নিউজলেটার” পাতা থেকে ব্যর্থগুলো আবার পাঠাতে পারবেন।`, 'error');
    else if (c.status === 'cancelled') done(c.last_error || 'পাঠানো বাতিল হয়েছে।', 'error');
    else done('কিছু ইমেইল পরে আবার চেষ্টার অপেক্ষায় আছে। পরের বার সারি চালালে (নিউজলেটার → সারি চালান) সেগুলো যাবে।');
  } catch (err) { done(errMsg(err), 'error'); }
  return m;
}
/** After publishing: find the auto campaign created by the database trigger and send it. */
async function sendAutoCampaign(article) {
  try {
    const c = (await run(sb.from('email_campaigns').select('id,status').eq('article_id', article.id).eq('kind', 'auto').limit(1)))[0];
    if (!c || !['queued', 'sending'].includes(c.status)) return;
    await runCampaign(c.id, 'সাবস্ক্রাইবারদের ইমেইল করা হচ্ছে');
  } catch (err) { toast(`লেখাটি প্রকাশিত হয়েছে, কিন্তু ইমেইল এখনো পাঠানো যায়নি: ${errMsg(err)}`, 'error', 12000); }
}

      info = await callFn({ action: 'preview', ...body() });
      fill(out, h('p', { class: 'hint', style: { margin: '0 0 0.5rem' }, text: `বিষয়: ${info.subject} · প্রাপক ${bnNum(info.recipient_count)} জন` }), h('iframe', { class: 'email-frame', sandbox: '', srcdoc: info.html, title: 'ইমেইলের প্রিভিউ' }),
        info.configured ? null : h('p', { class: 'form-msg form-msg--error', style: { marginTop: '0.6rem' }, text: 'ইমেইল পাঠানোর ব্যবস্থা এখনো সম্পন্ন হয়নি (ফাংশনের secret নেই)। প্রিভিউ দেখা যাবে, কিন্তু পাঠানো যাবে না। SETUP.md-র "নিউজলেটার: Resend আর ইমেইল ফাংশন" অংশ দেখুন।' }));
      sendBtn.disabled = !info.configured || !info.recipient_count; testBtn.disabled = !info.configured;
      if (info.configured && !info.recipient_count) out.append(h('p', { class: 'form-msg', style: { marginTop: '0.6rem', background: 'var(--gold-wash)' }, text: 'পাঠানোর মতো কোনো সাবস্ক্রাইবার এখনো নেই।' }));
    } catch (err) { out.replaceChildren(h('p', { class: 'form-msg form-msg--error', role: 'alert', text: errMsg(err) })); reset(); }
  }));
  testBtn.addEventListener('click', () => withLoading(testBtn, async () => { try { localCheck(); const r = await callFn({ action: 'test', ...body() }); toast(`${r.sent_to}-এ টেস্ট পাঠানো হয়েছে।`, 'ok'); } catch (err) { toast(errMsg(err), 'error', 9000); } }));
  sendBtn.addEventListener('click', async () => {
    if (!info) return;
    const n = info.recipient_count;
    const ok = await confirmDialog({ title: `${bnNum(n)} জন সাবস্ক্রাইবারকে পাঠাবেন?`, text: `“${info.subject}” এখনই বর্তমানে সাবস্ক্রাইব করা সবাইকে ইমেইল করা হবে। যাঁরা আনসাবস্ক্রাইব করেছেন তাঁরা বাদ যাবেন। একবার পাঠালে ফেরানো যায় না।`, confirmLabel: `${bnNum(n)} জনকে পাঠান`, cancelLabel: 'ফিরে যাই' });
    if (!ok) return;
    try { const r = await callFn({ action: 'create_campaign', ...body() }); m.close(); await runCampaign(r.campaign_id, 'নিউজলেটার পাঠানো হচ্ছে'); after?.(); } catch (err) { toast(errMsg(err), 'error', 9000); }
  });
}


/* =====================================================================
   17 · BOOT
   ===================================================================== */
async function boot() {
  initSupabase();
  loadCachedSettings();                 // instant: last-known name/logo from this browser
  buildShell();
  initCursor();
  // fresh settings (name, logo, tagline…) from the database; rebuild the shell only if something changed
  const settingsReady = loadSiteSettings().then((changed) => { if (changed) { buildShell(); } });
  if (sb) {
    sb.auth.onAuthStateChange((event) => {
      // never await supabase calls inside this callback — defer them
      if (event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'USER_UPDATED') setTimeout(() => refreshAuth(), 0);
    });
  }
  const path = location.pathname;
  const needsAuthFirst = path.startsWith('/auth/') || path === '/admin' || path.startsWith('/admin/');
  if (needsAuthFirst) await refreshAuth(); else refreshAuth();
  await Promise.race([settingsReady, sleep(1200)]);
  await render({ scroll: false });
  state.ready = true;
  clearTimeout(window.__cpFailsafe);
}
window.addEventListener('unhandledrejection', (e) => { console.error('Unhandled rejection:', e.reason); });
boot().catch((err) => {
  console.error(err);
  clearTimeout(window.__cpFailsafe);
  document.documentElement.classList.add('reveal-fallback');
  const main = $('#main');
  if (main) main.replaceChildren(h('div', { class: 'container section' }, h('div', { class: 'empty' }, h('h2', { text: 'সাইট চালু করতে গিয়ে কিছু একটা ভুল হয়েছে' }), h('p', { text: errMsg(err) }), h('button', { class: 'btn', type: 'button', onClick: () => location.reload() }, 'আবার লোড করুন'))));
});

</script>
